[project]
name = "jwtaudit"
version = "0.1.0"
description = "Black-box JWT auth attack-surface auditor (authorized security lab)"
requires-python = ">=3.11"
dependencies = [
  "PyJWT>=2.8",
  "cryptography>=42.0",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
jwtaudit = "jwtaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jwtaudit", "jwtaudit.probes"]
