services:
  vulnerable-server:
    build: ./targets/vulnerable-server
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"username":"alice","password":"password123"}'
          http://localhost:4000/login || exit 1
      interval: 5s
      retries: 3
      timeout: 3s
      start_period: 5s

  secure-server:
    build: ./targets/secure-server
    ports:
      - "4001:4001"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST -H 'Content-Type: application/json'
          -d '{"username":"alice","password":"password123"}'
          http://localhost:4001/login || exit 1
      interval: 5s
      retries: 3
      timeout: 3s
      start_period: 5s

  auditor:
    build: ./auditor
    depends_on:
      vulnerable-server:
        condition: service_healthy
      secure-server:
        condition: service_healthy
    command: jwtaudit audit --base-url http://vulnerable-server:4000
